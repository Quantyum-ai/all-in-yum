# PROJECT CONTEXT AND CONSTRAINTS
project_notes: |
  Project: all-in-yum - Electron desktop wrapper for aiy CLI

  The aiy CLI orchestrates multiple AI providers (Claude/Codex/Grok/Gemini)
  plus a local Ollama executor for privacy mode.

  HARD CONSTRAINT: Preserve privacy boundary
  - No code/paths/diffs sent to cloud providers
  - Local Ollama executor ONLY for sensitive operations
  - Desktop app wraps CLI via process execution/IPC
  - Rust workspace remains source of truth

  Architecture: New Electron app integrating with existing Rust CLI
  Key Features: Agent status, credentials, privacy mode, workflows

