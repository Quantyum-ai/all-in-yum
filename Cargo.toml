[workspace]
members = [
    "crates/aiy-core",
    "crates/aiy-adapters",
    "crates/aiy-adapter-grok",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Quantyum AI <dev@quantyum.ai>"]
repository = "https://github.com/Quantyum-ai/all-in-yum"

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Security
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1.7", features = ["derive"] }
keyring = "2"

# Error Handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"

# Text Processing
regex = "1"
once_cell = "1"
unicode-normalization = "0.1"

# Async Trait
async-trait = "0.1"

# Testing
mockall = "0.12"
tempfile = "3"

# Utilities
hex = "0.4"
dirs = "5"
